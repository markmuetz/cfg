set-window-option -g mode-keys vi

# Set up C-a as main command key (thanks muscle memory!)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind C-A
bind C-A last-window

# Fix Home/End keys on MASS
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
set -g default-terminal "screen-256color"

# Turn on mouse support and mouse copy/paste:
# https://unix.stackexchange.com/a/318285/78304
# With mouse on, tmux owns drag-selection. To use the terminal's own selection instead, hold
# Option (iTerm2), Fn (Terminal.app; or toggle View > Allow Mouse Reporting, Cmd-R) or Shift (Ghostty,
# most Linux terminals) while dragging.
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Make new windows/splits start from current path.
# https://unix.stackexchange.com/a/109453/78304
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Clipboard via OSC 52: tmux writes the copied text to the *outer* terminal as an escape sequence, which
# works over ssh and through nested tmux (Mac tmux -> ssh -> JASMIN tmux). No X server needed, so xclip is
# pointless on JASMIN (there is no $DISPLAY). The outer terminal must allow it (iTerm2: Settings > General >
# Selection > "Applications in terminal may access clipboard"; Ghostty/kitty/WezTerm: on by default;
# macOS Terminal.app: not supported).
# `on` (not the default `external`) also lets programs inside tmux (vim, an inner tmux) set the clipboard.
set -s set-clipboard on
# tmux only sends OSC 52 if it thinks the outer terminal supports it. xterm* is covered by default; add
# screen*/tmux* so the JASMIN tmux sends it when attached from inside the Mac tmux (TERM=screen-256color).
set -as terminal-features ',screen*:clipboard,tmux*:clipboard'
# Enter / end of mouse drag: copy and leave copy mode. Copying triggers OSC 52; on macOS also pipe to
# pbcopy, which works even in terminals without OSC 52 (Terminal.app).
if-shell '[ "$(uname -s)" = Darwin ]' {
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
}
